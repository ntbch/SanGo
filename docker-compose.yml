services:
  db:
    image: postgres:16-alpine
    container_name: sango-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sango
      POSTGRES_USER: sango
      POSTGRES_PASSWORD: sango
    ports:
      - '5432:5432'
    volumes:
      - sango_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sango -d sango']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sango_pgdata:
