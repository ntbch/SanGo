packages:
  - apps/*
  - packages/*
# Không package nào cần chạy postinstall để hoạt động:
# - esbuild dùng binary từ optional platform package (@esbuild/linux-x64)
# - @nestjs/core chỉ có script quảng cáo OpenCollective
allowBuilds:
  '@nestjs/core': false
  '@prisma/client': true # cần postinstall tải engine binaries cho migrate/generate
  '@prisma/engines': true
  esbuild: false
  prisma: true
