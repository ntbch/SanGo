name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    # Postgres 16 cho integration test chạy thật (đặc tả §8: Jest + Postgres
    # docker — luồng hold/convert, callback idempotent, race 2 request cùng slot)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: courthub
          POSTGRES_USER: courthub
          POSTGRES_PASSWORD: courthub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U courthub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # Đọc phiên bản pnpm từ trường packageManager của root package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint + Prettier)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Tạo schema trên service postgres trước khi integration test chạy
      # (migrations nằm ở apps/api/prisma/migrations — task T2)
      - name: Migrate database for integration tests
        run: pnpm --filter @courthub/api exec prisma migrate deploy

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgresql://courthub:courthub@localhost:5432/courthub

      - name: Build api + web
        run: pnpm build
