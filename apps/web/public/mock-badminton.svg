<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="badmMatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="badmOutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Flooring Surround -->
  <rect width="800" height="450" fill="url(#badmOutGrad)" />

  <!-- PVC Badminton Mat -->
  <rect x="70" y="40" width="660" height="370" rx="4" fill="url(#badmMatGrad)" stroke="#334155" stroke-width="2" />

  <!-- Outer Doubles Boundary -->
  <rect x="100" y="60" width="600" height="330" stroke="#ffffff" stroke-width="4" stroke-opacity="0.9" />

  <!-- Singles Side Lines -->
  <line x1="100" y1="85" x2="700" y2="85" stroke="#ffffff" stroke-width="3" stroke-opacity="0.9" />
  <line x1="100" y1="365" x2="700" y2="365" stroke="#ffffff" stroke-width="3" stroke-opacity="0.9" />

  <!-- Doubles Long Service Lines -->
  <line x1="135" y1="60" x2="135" y2="390" stroke="#ffffff" stroke-width="3" stroke-opacity="0.9" />
  <line x1="665" y1="60" x2="665" y2="390" stroke="#ffffff" stroke-width="3" stroke-opacity="0.9" />

  <!-- Short Service Lines -->
  <line x1="280" y1="60" x2="280" y2="390" stroke="#ffffff" stroke-width="3" stroke-opacity="0.9" />
  <line x1="520" y1="60" x2="520" y2="390" stroke="#ffffff" stroke-width="3" stroke-opacity="0.9" />

  <!-- Center Service Lines -->
  <line x1="100" y1="225" x2="280" y2="225" stroke="#ffffff" stroke-width="3" stroke-opacity="0.9" />
  <line x1="520" y1="225" x2="700" y2="225" stroke="#ffffff" stroke-width="3" stroke-opacity="0.9" />

  <!-- Center Net & Posts -->
  <line x1="400" y1="45" x2="400" y2="405" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <circle cx="400" cy="45" r="5" fill="#f8fafc" />
  <circle cx="400" cy="405" r="5" fill="#f8fafc" />

  <!-- Sport Badge -->
  <g transform="translate(320, 15)">
    <rect width="160" height="28" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.5" />
    <text x="80" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#a7f3d0" text-anchor="middle" letter-spacing="1">CẦU LÔNG BWF</text>
  </g>
</svg>
