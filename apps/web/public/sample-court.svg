<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="courtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#courtGrad)" />
  <!-- Court markings -->
  <rect x="80" y="45" width="640" height="360" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.8" rx="8" />
  <line x1="400" y1="45" x2="400" y2="405" stroke="#ffffff" stroke-width="4" opacity="0.8" />
  <circle cx="400" cy="225" r="70" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.8" />
  <circle cx="400" cy="225" r="6" fill="#ffffff" opacity="0.9" />
  <!-- Service boxes -->
  <line x1="80" y1="225" x2="240" y2="225" stroke="#ffffff" stroke-width="3" opacity="0.6" />
  <line x1="560" y1="225" x2="720" y2="225" stroke="#ffffff" stroke-width="3" opacity="0.6" />
  <!-- Branding badge -->
  <rect x="330" y="20" width="140" height="34" rx="17" fill="#022c22" opacity="0.9" />
  <text x="400" y="42" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#34d399" text-anchor="middle">SANGO COURT</text>
</svg>