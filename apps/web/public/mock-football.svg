<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="pitchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <pattern id="turfStripes" width="80" height="450" patternUnits="userSpaceOnUse">
      <rect width="40" height="450" fill="#ffffff" fill-opacity="0.04" />
    </pattern>
  </defs>

  <!-- Base Turf Background -->
  <rect width="800" height="450" fill="url(#pitchGrad)" />
  <rect width="800" height="450" fill="url(#turfStripes)" />

  <!-- Outer Pitch Boundary -->
  <rect x="50" y="35" width="700" height="380" rx="4" stroke="#ffffff" stroke-width="4" stroke-opacity="0.85" />

  <!-- Halfway Line -->
  <line x1="400" y1="35" x2="400" y2="415" stroke="#ffffff" stroke-width="4" stroke-opacity="0.85" />

  <!-- Center Circle & Spot -->
  <circle cx="400" cy="225" r="65" stroke="#ffffff" stroke-width="4" stroke-opacity="0.85" />
  <circle cx="400" cy="225" r="5" fill="#ffffff" fill-opacity="0.95" />

  <!-- Left Penalty Area & Goal -->
  <rect x="50" y="115" width="130" height="220" stroke="#ffffff" stroke-width="4" stroke-opacity="0.85" />
  <rect x="50" y="160" width="50" height="130" stroke="#ffffff" stroke-width="4" stroke-opacity="0.85" />
  <circle cx="130" cy="225" r="4" fill="#ffffff" fill-opacity="0.95" />
  <path d="M180 185 A50 50 0 0 1 180 265" stroke="#ffffff" stroke-width="4" stroke-opacity="0.85" fill="none" />

  <!-- Right Penalty Area & Goal -->
  <rect x="620" y="115" width="130" height="220" stroke="#ffffff" stroke-width="4" stroke-opacity="0.85" />
  <rect x="700" y="160" width="50" height="130" stroke="#ffffff" stroke-width="4" stroke-opacity="0.85" />
  <circle cx="670" cy="225" r="4" fill="#ffffff" fill-opacity="0.95" />
  <path d="M620 185 A50 50 0 0 0 620 265" stroke="#ffffff" stroke-width="4" stroke-opacity="0.85" fill="none" />

  <!-- Corner Arcs -->
  <path d="M50 55 A20 20 0 0 1 70 35" stroke="#ffffff" stroke-width="3" stroke-opacity="0.85" fill="none" />
  <path d="M50 395 A20 20 0 0 0 70 415" stroke="#ffffff" stroke-width="3" stroke-opacity="0.85" fill="none" />
  <path d="M750 55 A20 20 0 0 0 730 35" stroke="#ffffff" stroke-width="3" stroke-opacity="0.85" fill="none" />
  <path d="M750 395 A20 20 0 0 1 730 415" stroke="#ffffff" stroke-width="3" stroke-opacity="0.85" fill="none" />

  <!-- Sport Badge -->
  <g transform="translate(320, 20)">
    <rect width="160" height="30" rx="15" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <text x="80" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="1">BÓNG ĐÁ 5 &amp; 7</text>
  </g>
</svg>
