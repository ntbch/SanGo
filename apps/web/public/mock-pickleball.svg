<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="pballOutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="pballInGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="kitchenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
  </defs>

  <!-- Base Out of bounds -->
  <rect width="800" height="450" fill="url(#pballOutGrad)" />

  <!-- Outer Court Rectangle -->
  <rect x="80" y="45" width="640" height="360" fill="url(#pballInGrad)" stroke="#ffffff" stroke-width="4" stroke-opacity="0.9" />

  <!-- Non-Volley Zone (Kitchen) in Middle -->
  <rect x="300" y="45" width="200" height="360" fill="url(#kitchenGrad)" stroke="#ffffff" stroke-width="4" stroke-opacity="0.9" />

  <!-- Center Net Line & Posts -->
  <line x1="400" y1="35" x2="400" y2="415" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <circle cx="400" cy="35" r="5" fill="#f8fafc" />
  <circle cx="400" cy="415" r="5" fill="#f8fafc" />

  <!-- Service Centerline Left -->
  <line x1="80" y1="225" x2="300" y2="225" stroke="#ffffff" stroke-width="4" stroke-opacity="0.9" />

  <!-- Service Centerline Right -->
  <line x1="500" y1="225" x2="720" y2="225" stroke="#ffffff" stroke-width="4" stroke-opacity="0.9" />

  <!-- Sport Badge -->
  <g transform="translate(320, 20)">
    <rect width="160" height="30" rx="15" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <text x="80" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="1">PICKLEBALL PRO</text>
  </g>
</svg>
