<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="tennisOutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="tennisInGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Surround Court -->
  <rect width="800" height="450" fill="url(#tennisOutGrad)" />

  <!-- Inner Playing Court -->
  <rect x="70" y="45" width="660" height="360" fill="url(#tennisInGrad)" stroke="#ffffff" stroke-width="4" stroke-opacity="0.9" />

  <!-- Singles Side Lines -->
  <line x1="70" y1="85" x2="730" y2="85" stroke="#ffffff" stroke-width="3" stroke-opacity="0.9" />
  <line x1="70" y1="365" x2="730" y2="365" stroke="#ffffff" stroke-width="3" stroke-opacity="0.9" />

  <!-- Service Boxes Left & Right -->
  <line x1="220" y1="85" x2="220" y2="365" stroke="#ffffff" stroke-width="3" stroke-opacity="0.9" />
  <line x1="580" y1="85" x2="580" y2="365" stroke="#ffffff" stroke-width="3" stroke-opacity="0.9" />

  <!-- Center Service Line -->
  <line x1="220" y1="225" x2="580" y2="225" stroke="#ffffff" stroke-width="3" stroke-opacity="0.9" />

  <!-- Center Marks -->
  <line x1="70" y1="225" x2="85" y2="225" stroke="#ffffff" stroke-width="3" stroke-opacity="0.9" />
  <line x1="715" y1="225" x2="730" y2="225" stroke="#ffffff" stroke-width="3" stroke-opacity="0.9" />

  <!-- Center Net & Posts -->
  <line x1="400" y1="30" x2="400" y2="420" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <circle cx="400" cy="30" r="5" fill="#f8fafc" />
  <circle cx="400" cy="420" r="5" fill="#f8fafc" />

  <!-- Sport Badge -->
  <g transform="translate(320, 15)">
    <rect width="160" height="28" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.5" />
    <text x="80" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="1">TENNIS ITF PRO</text>
  </g>
</svg>
