# =============================================================================
# Render Blueprint — SanGo API (đặc tả §9)
# Docs: https://render.com/docs/blueprint-spec
#
# GHI CHÚ SCAFFOLDING: cấu hình viết sớm theo cấu trúc đã chốt — tên dịch vụ
# và URL thật sẽ được hiệu chỉnh ở mốc deploy cuối Giai đoạn 1.
#
# LƯU Ý FREE TIER: gói free của Render chưa hỗ trợ pre-deploy command
# (release command), nên `prisma migrate deploy` được nối vào CUỐI
# buildCommand để vẫn tự chạy migration mỗi lần deploy. Khi nâng plan,
# chuyển dòng đó sang `preDeployCommand` (xem mẫu ở cuối file).
#
# Prisma scripts (prisma:generate / prisma CLI) sẽ có sẵn cùng task T2 ·
# Prisma schema + migration + seed.
# =============================================================================
services:
  - type: web
    name: sango-api
    runtime: node
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    autoDeploy: true
    # Build từ gốc monorepo (pnpm workspace)
    buildCommand: >-
      corepack enable &&
      pnpm install --no-frozen-lockfile &&
      pnpm --filter @sango/shared build &&
      pnpm --filter @sango/api exec prisma generate &&
      pnpm --filter @sango/api build &&
      pnpm --filter @sango/api exec prisma migrate deploy
    startCommand: pnpm --filter @sango/api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: PAYMENT_MODE
        sync: false
      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false

# ----------------------------------------------------------------------------
# Mẫu khi nâng plan trả phí (tách migrate khỏi build, đúng nghĩa release):
#
#     buildCommand: >-
#       corepack enable &&
#       pnpm install --frozen-lockfile &&
#       pnpm --filter @sango/api prisma:generate &&
#       pnpm --filter @sango/api build
#     preDeployCommand: pnpm --filter @sango/api prisma migrate deploy
# -----------------------------------------------------------------------------
